name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run checks
        run: make check

  integration:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    env:
      BENCH_KAFKA_BOOTSTRAP: localhost:29092
      BENCH_REDIS_URL: redis://127.0.0.1:6379/0
      BENCH_POSTGRES_DSN: postgresql://commerce:commerce_local_dev@127.0.0.1:5432/commerce

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Bring up Kafka, Kafka init, PostgreSQL, and Redis
        run: docker compose up -d kafka kafka-init postgres redis

      - name: Wait for Kafka readiness
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T kafka \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs kafka
          exit 1

      - name: Wait for Kafka topic initialization
        run: docker compose wait kafka-init

      - name: Wait for PostgreSQL readiness
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T postgres pg_isready -U commerce -d commerce; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Apply database migrations
        run: docker compose --profile processor run --rm --build postgres-migrate

      - name: Run integration tests
        run: |
          python -m pytest -m integration -v --junitxml=integration-test-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("integration-test-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          executed = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if executed == 0:
              raise SystemExit("integration job collected no tests")
          if skipped:
              raise SystemExit(
                  f"integration job skipped {skipped} test(s); live dependencies may be unavailable"
              )
          print(f"Integration tests executed: {executed}; skipped: {skipped}")
          PY

      - name: Dump dependency logs on failure
        if: failure()
        run: docker compose logs kafka kafka-init postgres redis

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
