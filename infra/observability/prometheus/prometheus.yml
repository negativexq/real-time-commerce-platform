global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: event-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["event-processor:9101"]
  - job_name: event-generator
    metrics_path: /metrics
    static_configs:
      - targets: ["event-generator:9102"]
  - job_name: fraud-outbox-publisher
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-outbox-publisher:9103"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
