name: real-time-commerce-platform

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/opt/commerce/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/commerce/init-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx256m
    restart: unless-stopped

  postgres:
    image: postgres:17.5-bookworm
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_local_dev}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: ["postgres", "-c", "timezone=UTC"]
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 384m
    restart: unless-stopped

  event-generator:
    profiles: ["generator"]
    build:
      context: .
      dockerfile: services/event_generator/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-commerce.events}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-event-generator}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE:-lz4}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-20}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-65536}
      KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-30000}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-10000}
      GENERATOR_RATE_PER_SECOND: ${GENERATOR_RATE_PER_SECOND:-1.0}
      GENERATOR_MAX_PRODUCT_VIEWS: ${GENERATOR_MAX_PRODUCT_VIEWS:-20}
      GENERATOR_ADD_TO_CART_PROBABILITY: ${GENERATOR_ADD_TO_CART_PROBABILITY:-0.55}
      GENERATOR_CHECKOUT_PROBABILITY: ${GENERATOR_CHECKOUT_PROBABILITY:-0.70}
      GENERATOR_PAYMENT_SUCCESS_PROBABILITY: ${GENERATOR_PAYMENT_SUCCESS_PROBABILITY:-0.85}
      GENERATOR_REFUND_PROBABILITY: ${GENERATOR_REFUND_PROBABILITY:-0.05}
      GENERATOR_SEED: ${GENERATOR_SEED:-}
      GENERATOR_LOG_LEVEL: ${GENERATOR_LOG_LEVEL:-INFO}
      GENERATOR_FLUSH_TIMEOUT_SECONDS: ${GENERATOR_FLUSH_TIMEOUT_SECONDS:-10}
      GENERATOR_JOURNEYS: ${GENERATOR_JOURNEYS:-}
      GENERATOR_CUSTOMER_POOL_SIZE: ${GENERATOR_CUSTOMER_POOL_SIZE:-100}
      GENERATOR_NEW_CUSTOMER_PROBABILITY: ${GENERATOR_NEW_CUSTOMER_PROBABILITY:-0.35}
      GENERATOR_PERSONA_WEIGHTS: ${GENERATOR_PERSONA_WEIGHTS:-normal=0.50,indecisive=0.15,discount_hunter=0.15,suspicious=0.10,bot=0.05,account_takeover=0.05}
      GENERATOR_STATEFUL_MODE: ${GENERATOR_STATEFUL_MODE:-true}
      GENERATOR_MAX_PAYMENT_ATTEMPTS: ${GENERATOR_MAX_PAYMENT_ATTEMPTS:-3}
      GENERATOR_PAYMENT_RETRY_PROBABILITY: ${GENERATOR_PAYMENT_RETRY_PROBABILITY:-0.65}
      GENERATOR_ANOMALIES_ENABLED: ${GENERATOR_ANOMALIES_ENABLED:-false}
      GENERATOR_DUPLICATE_EVENT_PROBABILITY: ${GENERATOR_DUPLICATE_EVENT_PROBABILITY:-0}
      GENERATOR_MALFORMED_JSON_PROBABILITY: ${GENERATOR_MALFORMED_JSON_PROBABILITY:-0}
      GENERATOR_MISSING_FIELD_PROBABILITY: ${GENERATOR_MISSING_FIELD_PROBABILITY:-0}
      GENERATOR_UNKNOWN_EVENT_TYPE_PROBABILITY: ${GENERATOR_UNKNOWN_EVENT_TYPE_PROBABILITY:-0}
      GENERATOR_LATE_EVENT_PROBABILITY: ${GENERATOR_LATE_EVENT_PROBABILITY:-0}
      GENERATOR_OUT_OF_ORDER_PROBABILITY: ${GENERATOR_OUT_OF_ORDER_PROBABILITY:-0}
      GENERATOR_PAYLOAD_MISMATCH_PROBABILITY: ${GENERATOR_PAYLOAD_MISMATCH_PROBABILITY:-0}
      GENERATOR_MAX_LATE_EVENT_SECONDS: ${GENERATOR_MAX_LATE_EVENT_SECONDS:-86400}
      GENERATOR_MAX_ANOMALIES_PER_JOURNEY: ${GENERATOR_MAX_ANOMALIES_PER_JOURNEY:-2}
    mem_limit: 320m
    restart: unless-stopped

volumes:
  kafka-data:
    name: real-time-commerce-platform-kafka-data
  postgres-data:
    name: real-time-commerce-platform-postgres-data
  redis-data:
    name: real-time-commerce-platform-redis-data
