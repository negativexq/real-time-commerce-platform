name: real-time-commerce-platform

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/opt/commerce/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/commerce/init-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx256m
    restart: unless-stopped

  postgres:
    image: postgres:17.5-bookworm
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_local_dev}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: ["postgres", "-c", "timezone=UTC"]
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 384m
    restart: unless-stopped

  event-generator:
    profiles: ["generator"]
    build:
      context: .
      dockerfile: services/event_generator/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: 0.0.0.0
      METRICS_NAMESPACE: ${METRICS_NAMESPACE:-commerce}
      GENERATOR_METRICS_PORT: ${GENERATOR_METRICS_PORT:-9102}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-commerce.events}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-event-generator}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE:-lz4}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-20}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-65536}
      KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-30000}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-10000}
      GENERATOR_RATE_PER_SECOND: ${GENERATOR_RATE_PER_SECOND:-1.0}
      GENERATOR_MAX_PRODUCT_VIEWS: ${GENERATOR_MAX_PRODUCT_VIEWS:-20}
      GENERATOR_ADD_TO_CART_PROBABILITY: ${GENERATOR_ADD_TO_CART_PROBABILITY:-0.55}
      GENERATOR_CHECKOUT_PROBABILITY: ${GENERATOR_CHECKOUT_PROBABILITY:-0.70}
      GENERATOR_PAYMENT_SUCCESS_PROBABILITY: ${GENERATOR_PAYMENT_SUCCESS_PROBABILITY:-0.85}
      GENERATOR_REFUND_PROBABILITY: ${GENERATOR_REFUND_PROBABILITY:-0.05}
      GENERATOR_SEED: ${GENERATOR_SEED:-}
      GENERATOR_LOG_LEVEL: ${GENERATOR_LOG_LEVEL:-INFO}
      GENERATOR_FLUSH_TIMEOUT_SECONDS: ${GENERATOR_FLUSH_TIMEOUT_SECONDS:-10}
      GENERATOR_JOURNEYS: ${GENERATOR_JOURNEYS:-}
      GENERATOR_CUSTOMER_POOL_SIZE: ${GENERATOR_CUSTOMER_POOL_SIZE:-100}
      GENERATOR_NEW_CUSTOMER_PROBABILITY: ${GENERATOR_NEW_CUSTOMER_PROBABILITY:-0.35}
      GENERATOR_PERSONA_WEIGHTS: ${GENERATOR_PERSONA_WEIGHTS:-normal=0.50,indecisive=0.15,discount_hunter=0.15,suspicious=0.10,bot=0.05,account_takeover=0.05}
      GENERATOR_STATEFUL_MODE: ${GENERATOR_STATEFUL_MODE:-true}
      GENERATOR_MAX_PAYMENT_ATTEMPTS: ${GENERATOR_MAX_PAYMENT_ATTEMPTS:-3}
      GENERATOR_PAYMENT_RETRY_PROBABILITY: ${GENERATOR_PAYMENT_RETRY_PROBABILITY:-0.65}
      GENERATOR_ANOMALIES_ENABLED: ${GENERATOR_ANOMALIES_ENABLED:-false}
      GENERATOR_DUPLICATE_EVENT_PROBABILITY: ${GENERATOR_DUPLICATE_EVENT_PROBABILITY:-0}
      GENERATOR_MALFORMED_JSON_PROBABILITY: ${GENERATOR_MALFORMED_JSON_PROBABILITY:-0}
      GENERATOR_MISSING_FIELD_PROBABILITY: ${GENERATOR_MISSING_FIELD_PROBABILITY:-0}
      GENERATOR_UNKNOWN_EVENT_TYPE_PROBABILITY: ${GENERATOR_UNKNOWN_EVENT_TYPE_PROBABILITY:-0}
      GENERATOR_LATE_EVENT_PROBABILITY: ${GENERATOR_LATE_EVENT_PROBABILITY:-0}
      GENERATOR_OUT_OF_ORDER_PROBABILITY: ${GENERATOR_OUT_OF_ORDER_PROBABILITY:-0}
      GENERATOR_PAYLOAD_MISMATCH_PROBABILITY: ${GENERATOR_PAYLOAD_MISMATCH_PROBABILITY:-0}
      GENERATOR_MAX_LATE_EVENT_SECONDS: ${GENERATOR_MAX_LATE_EVENT_SECONDS:-86400}
      GENERATOR_MAX_ANOMALIES_PER_JOURNEY: ${GENERATOR_MAX_ANOMALIES_PER_JOURNEY:-2}
    mem_limit: 320m
    restart: unless-stopped

  event-processor:
    profiles: ["processor"]
    build:
      context: .
      dockerfile: services/event_processor/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    environment:
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: 0.0.0.0
      METRICS_NAMESPACE: ${METRICS_NAMESPACE:-commerce}
      PROCESSOR_METRICS_PORT: ${PROCESSOR_METRICS_PORT:-9101}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSOR_INPUT_TOPIC: ${PROCESSOR_INPUT_TOPIC:-commerce.events}
      PROCESSOR_DLQ_TOPIC: ${PROCESSOR_DLQ_TOPIC:-commerce.events.dlq}
      PROCESSOR_CONSUMER_GROUP: ${PROCESSOR_CONSUMER_GROUP:-commerce-event-processor-v1}
      PROCESSOR_CLIENT_ID: ${PROCESSOR_CLIENT_ID:-commerce-event-processor}
      PROCESSOR_AUTO_OFFSET_RESET: ${PROCESSOR_AUTO_OFFSET_RESET:-earliest}
      PROCESSOR_SESSION_TIMEOUT_MS: ${PROCESSOR_SESSION_TIMEOUT_MS:-10000}
      PROCESSOR_HEARTBEAT_INTERVAL_MS: ${PROCESSOR_HEARTBEAT_INTERVAL_MS:-3000}
      PROCESSOR_MAX_POLL_INTERVAL_MS: ${PROCESSOR_MAX_POLL_INTERVAL_MS:-300000}
      PROCESSOR_POLL_TIMEOUT_SECONDS: ${PROCESSOR_POLL_TIMEOUT_SECONDS:-1}
      PROCESSOR_IDLE_TIMEOUT_SECONDS: ${PROCESSOR_IDLE_TIMEOUT_SECONDS:-10}
      PROCESSOR_MAX_PROCESSING_ATTEMPTS: ${PROCESSOR_MAX_PROCESSING_ATTEMPTS:-3}
      PROCESSOR_RETRY_INITIAL_BACKOFF_MS: ${PROCESSOR_RETRY_INITIAL_BACKOFF_MS:-100}
      PROCESSOR_RETRY_MAX_BACKOFF_MS: ${PROCESSOR_RETRY_MAX_BACKOFF_MS:-2000}
      PROCESSOR_RETRY_MULTIPLIER: ${PROCESSOR_RETRY_MULTIPLIER:-2}
      PROCESSOR_RETRY_JITTER_RATIO: ${PROCESSOR_RETRY_JITTER_RATIO:-0.1}
      PROCESSOR_IDEMPOTENCY_PROCESSING_TTL_SECONDS: ${PROCESSOR_IDEMPOTENCY_PROCESSING_TTL_SECONDS:-60}
      PROCESSOR_IDEMPOTENCY_COMPLETED_TTL_SECONDS: ${PROCESSOR_IDEMPOTENCY_COMPLETED_TTL_SECONDS:-604800}
      PROCESSOR_IDEMPOTENCY_KEY_PREFIX: ${PROCESSOR_IDEMPOTENCY_KEY_PREFIX:-commerce:processor:v1:event}
      PROCESSOR_REDIS_SOCKET_TIMEOUT_SECONDS: ${PROCESSOR_REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      PROCESSOR_REDIS_CONNECT_TIMEOUT_SECONDS: ${PROCESSOR_REDIS_CONNECT_TIMEOUT_SECONDS:-2}
      PROCESSOR_DLQ_MAX_PAYLOAD_BYTES: ${PROCESSOR_DLQ_MAX_PAYLOAD_BYTES:-65536}
      PROCESSOR_DLQ_DELIVERY_TIMEOUT_MS: ${PROCESSOR_DLQ_DELIVERY_TIMEOUT_MS:-10000}
      PROCESSOR_SHUTDOWN_TIMEOUT_SECONDS: ${PROCESSOR_SHUTDOWN_TIMEOUT_SECONDS:-10}
      PROCESSOR_LOG_LEVEL: ${PROCESSOR_LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://commerce:commerce_local_dev@postgres:5432/commerce}
      PROCESSOR_DB_POOL_MIN_SIZE: ${PROCESSOR_DB_POOL_MIN_SIZE:-1}
      PROCESSOR_DB_POOL_MAX_SIZE: ${PROCESSOR_DB_POOL_MAX_SIZE:-4}
      PROCESSOR_DB_CONNECT_TIMEOUT_SECONDS: ${PROCESSOR_DB_CONNECT_TIMEOUT_SECONDS:-5}
      PROCESSOR_DB_ACQUIRE_TIMEOUT_SECONDS: ${PROCESSOR_DB_ACQUIRE_TIMEOUT_SECONDS:-5}
      PROCESSOR_DB_STATEMENT_TIMEOUT_MS: ${PROCESSOR_DB_STATEMENT_TIMEOUT_MS:-5000}
      PROCESSOR_DB_MAX_IDLE_SECONDS: ${PROCESSOR_DB_MAX_IDLE_SECONDS:-300}
      PROCESSOR_DB_HEALTHCHECK_INTERVAL_SECONDS: ${PROCESSOR_DB_HEALTHCHECK_INTERVAL_SECONDS:-30}
      PROCESSOR_DB_STARTUP_ATTEMPTS: ${PROCESSOR_DB_STARTUP_ATTEMPTS:-5}
      PROCESSOR_DB_STARTUP_BACKOFF_SECONDS: ${PROCESSOR_DB_STARTUP_BACKOFF_SECONDS:-1}
      PROCESSOR_REQUIRED_SCHEMA_VERSION: ${PROCESSOR_REQUIRED_SCHEMA_VERSION:-4}
      PROCESSOR_PERSIST_RAW_EVENT_JSON: ${PROCESSOR_PERSIST_RAW_EVENT_JSON:-true}
      PROCESSOR_DB_LOG_SLOW_QUERY_MS: ${PROCESSOR_DB_LOG_SLOW_QUERY_MS:-250}
      FRAUD_ENGINE_ENABLED: ${FRAUD_ENGINE_ENABLED:-true}
      FRAUD_ENGINE_VERSION: ${FRAUD_ENGINE_VERSION:-1.0.0}
      FRAUD_RULESET_VERSION: ${FRAUD_RULESET_VERSION:-2026-08}
      FRAUD_ENABLED_RULES: ${FRAUD_ENABLED_RULES:-high_amount,payment_velocity,failed_payment_burst,new_device,country_mismatch,rapid_checkout,account_takeover_composite,refund_abuse,bot_checkout,payment_amount_mismatch}
      FRAUD_REVIEW_THRESHOLD: ${FRAUD_REVIEW_THRESHOLD:-30}
      FRAUD_BLOCK_THRESHOLD: ${FRAUD_BLOCK_THRESHOLD:-60}
      FRAUD_HISTORY_LOOKBACK_DAYS: ${FRAUD_HISTORY_LOOKBACK_DAYS:-30}
      FRAUD_MAX_HISTORY_RECORDS: ${FRAUD_MAX_HISTORY_RECORDS:-500}
      FRAUD_HIGH_AMOUNT_THRESHOLD: ${FRAUD_HIGH_AMOUNT_THRESHOLD:-5000.00}
      FRAUD_AMOUNT_MULTIPLIER_THRESHOLD: ${FRAUD_AMOUNT_MULTIPLIER_THRESHOLD:-3}
      FRAUD_HIGH_AMOUNT_SCORE: ${FRAUD_HIGH_AMOUNT_SCORE:-25}
      FRAUD_AMOUNT_DEVIATION_SCORE: ${FRAUD_AMOUNT_DEVIATION_SCORE:-20}
      FRAUD_VELOCITY_MAX_ATTEMPTS: ${FRAUD_VELOCITY_MAX_ATTEMPTS:-3}
      FRAUD_VELOCITY_WINDOW_SECONDS: ${FRAUD_VELOCITY_WINDOW_SECONDS:-120}
      FRAUD_VELOCITY_SCORE: ${FRAUD_VELOCITY_SCORE:-20}
      FRAUD_FAILED_PAYMENT_THRESHOLD: ${FRAUD_FAILED_PAYMENT_THRESHOLD:-3}
      FRAUD_FAILED_PAYMENT_WINDOW_SECONDS: ${FRAUD_FAILED_PAYMENT_WINDOW_SECONDS:-300}
      FRAUD_FAILED_PAYMENT_SCORE: ${FRAUD_FAILED_PAYMENT_SCORE:-25}
      FRAUD_NEW_DEVICE_SCORE: ${FRAUD_NEW_DEVICE_SCORE:-15}
      FRAUD_MIN_HISTORY_FOR_DEVICE_RULE: ${FRAUD_MIN_HISTORY_FOR_DEVICE_RULE:-2}
      FRAUD_COUNTRY_MISMATCH_SCORE: ${FRAUD_COUNTRY_MISMATCH_SCORE:-10}
      FRAUD_MULTI_COUNTRY_SCORE: ${FRAUD_MULTI_COUNTRY_SCORE:-10}
      FRAUD_COUNTRY_WINDOW_SECONDS: ${FRAUD_COUNTRY_WINDOW_SECONDS:-600}
      FRAUD_RAPID_CHECKOUT_SECONDS: ${FRAUD_RAPID_CHECKOUT_SECONDS:-15}
      FRAUD_RAPID_CHECKOUT_SCORE: ${FRAUD_RAPID_CHECKOUT_SCORE:-15}
      FRAUD_ACCOUNT_TAKEOVER_SCORE: ${FRAUD_ACCOUNT_TAKEOVER_SCORE:-60}
      FRAUD_ACCOUNT_TAKEOVER_MIN_SIGNALS: ${FRAUD_ACCOUNT_TAKEOVER_MIN_SIGNALS:-4}
      FRAUD_REFUND_RATE_THRESHOLD: ${FRAUD_REFUND_RATE_THRESHOLD:-0.50}
      FRAUD_RAPID_REFUND_SECONDS: ${FRAUD_RAPID_REFUND_SECONDS:-600}
      FRAUD_REFUND_ABUSE_SCORE: ${FRAUD_REFUND_ABUSE_SCORE:-35}
      FRAUD_BOT_VIEW_THRESHOLD: ${FRAUD_BOT_VIEW_THRESHOLD:-12}
      FRAUD_BOT_CHECKOUT_SCORE: ${FRAUD_BOT_CHECKOUT_SCORE:-30}
      FRAUD_AMOUNT_MISMATCH_SCORE: ${FRAUD_AMOUNT_MISMATCH_SCORE:-100}
      FRAUD_ALERT_TOPIC: ${FRAUD_ALERT_TOPIC:-commerce.fraud-alerts}
      FRAUD_OUTBOX_ENABLED: ${FRAUD_OUTBOX_ENABLED:-true}
    mem_limit: 320m
    restart: unless-stopped

  demo-verification-processor:
    profiles: ["demo-verification"]
    build:
      context: .
      dockerfile: services/event_processor/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    environment:
      METRICS_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSOR_INPUT_TOPIC: commerce.events
      PROCESSOR_DLQ_TOPIC: commerce.events.dlq
      PROCESSOR_CONSUMER_GROUP: commerce-demo-verification-v1
      PROCESSOR_CLIENT_ID: commerce-demo-verification
      PROCESSOR_AUTO_OFFSET_RESET: latest
      PROCESSOR_IDEMPOTENCY_KEY_PREFIX: ${PROCESSOR_IDEMPOTENCY_KEY_PREFIX:-commerce:processor:v1:event}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://commerce:commerce_local_dev@postgres:5432/commerce}
      PROCESSOR_REQUIRED_SCHEMA_VERSION: ${PROCESSOR_REQUIRED_SCHEMA_VERSION:-4}
      FRAUD_ENGINE_ENABLED: "true"
      FRAUD_OUTBOX_ENABLED: "true"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/event-processor-healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 320m
    restart: "no"

  postgres-migrate:
    profiles: ["processor", "fraud", "demo"]
    build:
      context: .
      dockerfile: services/event_processor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://commerce:commerce_local_dev@postgres:5432/commerce}
      PROCESSOR_REQUIRED_SCHEMA_VERSION: ${PROCESSOR_REQUIRED_SCHEMA_VERSION:-4}
    entrypoint:
      ["python", "-m", "services.event_processor.persistence.migrations", "migrate"]
    restart: "no"

  fraud-outbox-publisher:
    profiles: ["fraud"]
    build:
      context: .
      dockerfile: services/fraud_outbox_publisher/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    environment:
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: 0.0.0.0
      METRICS_NAMESPACE: ${METRICS_NAMESPACE:-commerce}
      FRAUD_OUTBOX_METRICS_PORT: ${FRAUD_OUTBOX_METRICS_PORT:-9103}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://commerce:commerce_local_dev@postgres:5432/commerce}
      PROCESSOR_REQUIRED_SCHEMA_VERSION: ${PROCESSOR_REQUIRED_SCHEMA_VERSION:-4}
      FRAUD_ALERT_TOPIC: ${FRAUD_ALERT_TOPIC:-commerce.fraud-alerts}
      FRAUD_OUTBOX_ENABLED: ${FRAUD_OUTBOX_ENABLED:-true}
      FRAUD_OUTBOX_BATCH_SIZE: ${FRAUD_OUTBOX_BATCH_SIZE:-20}
      FRAUD_OUTBOX_POLL_INTERVAL_MS: ${FRAUD_OUTBOX_POLL_INTERVAL_MS:-500}
      FRAUD_OUTBOX_MAX_ATTEMPTS: ${FRAUD_OUTBOX_MAX_ATTEMPTS:-10}
      FRAUD_OUTBOX_INITIAL_BACKOFF_MS: ${FRAUD_OUTBOX_INITIAL_BACKOFF_MS:-500}
      FRAUD_OUTBOX_MAX_BACKOFF_MS: ${FRAUD_OUTBOX_MAX_BACKOFF_MS:-30000}
      FRAUD_OUTBOX_CLAIM_TTL_SECONDS: ${FRAUD_OUTBOX_CLAIM_TTL_SECONDS:-30}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/fraud-outbox-healthy"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s
    mem_limit: 256m
    restart: unless-stopped

  kafka-exporter:
    profiles: ["observability"]
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9308/metrics"]
      interval: 15s
      timeout: 5s
      retries: 6
    mem_limit: 128m
    restart: unless-stopped

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://commerce:commerce_local_dev@postgres:5432/commerce?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 6
    mem_limit: 128m
    restart: unless-stopped

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 15s
      timeout: 5s
      retries: 6
    mem_limit: 96m
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      kafka-exporter:
        condition: service_healthy
      postgres-exporter:
        condition: service_healthy
      redis-exporter:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 384m
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-commerce_local_dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 384m
    restart: unless-stopped

  demo-control-api:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: services/demo_control_api/Dockerfile
    ports:
      - "127.0.0.1:${DEMO_API_HOST_PORT:-8082}:8080"
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://commerce:commerce_local_dev@postgres:5432/commerce}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEMO_MAX_CONCURRENT_RUNS: ${DEMO_MAX_CONCURRENT_RUNS:-2}
      DEMO_RUN_TIMEOUT_SECONDS: ${DEMO_RUN_TIMEOUT_SECONDS:-3600}
      DEMO_RUN_STOP_TIMEOUT_SECONDS: ${DEMO_RUN_STOP_TIMEOUT_SECONDS:-15}
      DEMO_PROGRESS_REFRESH_INTERVAL_MS: ${DEMO_PROGRESS_REFRESH_INTERVAL_MS:-1000}
      DEMO_MAX_EVENT_COUNT: ${DEMO_MAX_EVENT_COUNT:-100000}
      DEMO_MAX_EVENTS_PER_SECOND: ${DEMO_MAX_EVENTS_PER_SECOND:-1000}
      DEMO_MAX_DURATION_SECONDS: ${DEMO_MAX_DURATION_SECONDS:-3600}
      DEMO_ALLOWED_ORIGINS: ${DEMO_ALLOWED_ORIGINS:-http://localhost:3003}
      DEMO_API_TOKEN_ENABLED: ${DEMO_API_TOKEN_ENABLED:-false}
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:-}
      DEMO_HISTORY_PAGE_SIZE: ${DEMO_HISTORY_PAGE_SIZE:-20}
      DEMO_HISTORY_MAX_PAGE_SIZE: ${DEMO_HISTORY_MAX_PAGE_SIZE:-100}
      DEMO_HEALTH_CACHE_SECONDS: ${DEMO_HEALTH_CACHE_SECONDS:-5}
      DEMO_PROMETHEUS_TIMEOUT_SECONDS: ${DEMO_PROMETHEUS_TIMEOUT_SECONDS:-3}
      DEMO_SSE_HEARTBEAT_SECONDS: ${DEMO_SSE_HEARTBEAT_SECONDS:-10}
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3002}
      KAFKA_UI_URL: http://localhost:${KAFKA_UI_PORT:-8080}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      event-processor:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 10s
    mem_limit: 384m
    restart: unless-stopped

  demo-control-web:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/demo_control_web/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_API_URL: ${DEMO_WEB_PUBLIC_API_URL:-http://localhost:8082}
    ports:
      - "127.0.0.1:${DEMO_WEB_HOST_PORT:-3003}:3000"
    environment:
      DEMO_API_INTERNAL_URL: http://demo-control-api:8080
    depends_on:
      demo-control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://demo-control-web:3000"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 15s
    mem_limit: 256m
    restart: unless-stopped

volumes:
  kafka-data:
    name: real-time-commerce-platform-kafka-data
  postgres-data:
    name: real-time-commerce-platform-postgres-data
  redis-data:
    name: real-time-commerce-platform-redis-data
  prometheus_data:
    name: real-time-commerce-platform-prometheus-data
  grafana_data:
    name: real-time-commerce-platform-grafana-data
