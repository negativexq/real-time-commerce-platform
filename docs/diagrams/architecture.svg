<rect x="40" y="540" width="1160" height="110" rx="14" fill="#ffffff" stroke="#dfe4ea"/>
<text x="62" y="572" class="t" font-size="14" font-weight="650" text-anchor="start">Observability</text>
<text x="62" y="594" class="t mut" font-size="12" font-weight="400" text-anchor="start">Every service and exporter exposes /metrics,</text>
<text x="62" y="611" class="t mut" font-size="12" font-weight="400" text-anchor="start">with bounded labels: no run or business IDs.</text>
