<circle cx="739" cy="582" r="4.5" fill="#0e8a91"/>
<text x="751" y="586.5" class="t" font-size="14" font-weight="600" text-anchor="start">Grafana</text>
<text x="736" y="608" class="t mut" font-size="12" font-weight="400" text-anchor="start">7 provisioned dashboards</text>
