<text x="996" y="110" class="t mut" font-size="12" font-weight="400" text-anchor="start">leases, completion markers</text>
<rect x="980" y="180" width="220" height="296" rx="12" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<circle cx="999" cy="204" r="4.5" fill="#2f7d45"/>
<text x="1011" y="208.5" class="t" font-size="14" font-weight="600" text-anchor="start">PostgreSQL</text>
<line x1="997" y1="226" x2="1017" y2="226" stroke="#2f7d45" stroke-dasharray="3 4"/>
<text x="1024" y="230" class="t" font-size="12" font-weight="400" text-anchor="start" style="fill:#2f7d45">one transaction per event</text>
