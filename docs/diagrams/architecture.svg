<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" role="img" aria-label="Architecture: the scenario runner publishes to Kafka; three Go processors take Redis leases and write each event in one PostgreSQL transaction; failures go to a DLQ topic and a sink copies them into PostgreSQL for triage and replay; an outbox publisher sends fraud alerts">
<title>Architecture: the scenario runner publishes to Kafka; three Go processors take Redis leases and write each event in one PostgreSQL transaction; failures go to a DLQ topic and a sink copies them into PostgreSQL for triage and replay; an outbox publisher sends fraud alerts</title>
<style>
  .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #151c25; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #151c25; }
  .mut { fill: #5d6673; }
  .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
  .fast { animation-duration: 0.8s; }
  .slow { animation-duration: 3.2s; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity=".07"/></filter>
  <marker id="ah-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a91"/></marker>
  <marker id="ah-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d45"/></marker>
  <marker id="ah-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a86a0c"/></marker>
  <marker id="ah-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c23b28"/></marker>
  <marker id="ah-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6673"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="689" rx="16" fill="#f3f5f8" stroke="#dfe4ea"/>
<rect x="40" y="70" width="230" height="96" rx="10" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<circle cx="59" cy="94" r="4.5" fill="#0e8a91"/>
<text x="71" y="98.5" class="t" font-size="14" font-weight="600" text-anchor="start">Commerce console</text>
<text x="56" y="120" class="t mut" font-size="12" font-weight="400" text-anchor="start">Next.js web + FastAPI</text>
<text x="56" y="137" class="t mut" font-size="12" font-weight="400" text-anchor="start">runs, fraud, dead-letter triage</text>
<rect x="40" y="250" width="230" height="96" rx="10" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<circle cx="59" cy="274" r="4.5" fill="#0e8a91" class="pulse"/>
<text x="71" y="278.5" class="t" font-size="14" font-weight="600" text-anchor="start">Scenario runner</text>
<text x="56" y="300" class="t mut" font-size="12" font-weight="400" text-anchor="start">seeded customer journeys</text>
<text x="56" y="317" class="t mut" font-size="12" font-weight="400" text-anchor="start">bounded count and rate</text>
<rect x="330" y="40" width="270" height="436" rx="14" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<text x="352" y="72" class="t" font-size="16" font-weight="650" text-anchor="start">Kafka</text>
<text x="352" y="92" class="t mut" font-size="12" font-weight="400" text-anchor="start">KRaft, single broker</text>
<rect x="350" y="118" width="230" height="58" rx="9" fill="#f3f5f8" stroke="#dfe4ea"/>
<rect x="350" y="128" width="3" height="38" rx="1.5" fill="#0e8a91"/>
<text x="366" y="143" class="m" font-size="13" font-weight="600" text-anchor="start">commerce.events</text>
<text x="366" y="162" class="t mut" font-size="11.5" font-weight="400" text-anchor="start">3 partitions, keyed by customer</text>
