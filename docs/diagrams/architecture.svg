<rect x="350" y="398" width="230" height="58" rx="9" fill="#f3f5f8" stroke="#dfe4ea"/>
<rect x="350" y="408" width="3" height="38" rx="1.5" fill="#c23b28"/>
<text x="366" y="423" class="m" font-size="13" font-weight="600" text-anchor="start">commerce.fraud-alerts</text>
<text x="366" y="442" class="t mut" font-size="11.5" font-weight="400" text-anchor="start">derived events from the outbox</text>
<rect x="660" y="60" width="260" height="150" rx="10" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<circle cx="679" cy="84" r="4.5" fill="#2f7d45" class="pulse"/>
<text x="691" y="88.5" class="t" font-size="14" font-weight="600" text-anchor="start">Event processor</text>
<text x="904" y="88.5" class="m mut" font-size="12" font-weight="400" text-anchor="end">Go</text>
<text x="676" y="114" class="m" font-size="11.5" font-weight="600" text-anchor="start" style="fill:#0e8a91">1</text>
<text x="694" y="114" class="t mut" font-size="12" font-weight="400" text-anchor="start">validate the contract</text>
<text x="676" y="136" class="m" font-size="11.5" font-weight="600" text-anchor="start" style="fill:#0e8a91">2</text>
<text x="694" y="136" class="t mut" font-size="12" font-weight="400" text-anchor="start">take a Redis lease</text>
<text x="676" y="158" class="m" font-size="11.5" font-weight="600" text-anchor="start" style="fill:#0e8a91">3</text>
<text x="694" y="158" class="t mut" font-size="12" font-weight="400" text-anchor="start">one PostgreSQL transaction</text>
<text x="676" y="180" class="m" font-size="11.5" font-weight="600" text-anchor="start" style="fill:#0e8a91">4</text>
<text x="694" y="180" class="t mut" font-size="12" font-weight="400" text-anchor="start">commit the offset</text>
<rect x="660" y="262" width="260" height="84" rx="10" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<circle cx="679" cy="286" r="4.5" fill="#a86a0c"/>
<text x="691" y="290.5" class="t" font-size="14" font-weight="600" text-anchor="start">DLQ sink</text>
<text x="676" y="312" class="t mut" font-size="12" font-weight="400" text-anchor="start">copies each dead letter once</text>
<text x="676" y="329" class="t mut" font-size="12" font-weight="400" text-anchor="start">into PostgreSQL</text>
<rect x="660" y="392" width="260" height="84" rx="10" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<circle cx="679" cy="416" r="4.5" fill="#c23b28"/>
<text x="691" y="420.5" class="t" font-size="14" font-weight="600" text-anchor="start">Fraud outbox publisher</text>
<text x="676" y="442" class="t mut" font-size="12" font-weight="400" text-anchor="start">claims committed rows,</text>
<text x="676" y="459" class="t mut" font-size="12" font-weight="400" text-anchor="start">publishes at least once</text>
<rect x="980" y="60" width="220" height="80" rx="10" fill="#ffffff" stroke="#dfe4ea" filter="url(#sh)"/>
<circle cx="999" cy="84" r="4.5" fill="#7b8491"/>
