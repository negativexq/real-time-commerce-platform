[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-commerce-platform"
version = "0.1.0"
description = "A local event-driven commerce platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Real-Time Commerce Platform Contributors" }]
dependencies = [
    "confluent-kafka==2.11.1",
    "pydantic>=2.11,<3",
    "psycopg[binary]==3.2.9",
    "psycopg-pool==3.2.6",
    "redis==6.2.0",
    "structlog==25.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["services*", "shared*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the live repository-managed PostgreSQL service",
]
